<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuordnungsspiel: Töne und Bilder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2c3e50;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            text-align: center;
        }

        p.instruction {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .stats {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .board-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        .board-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        .card {
            width: 130px;
            height: 130px;
            background-color: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
            border: 4px solid transparent;
            overflow: hidden;
            position: relative;
        }

        .card:hover:not(.matched) {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }

        .card.selected {
            border-color: #3498db;
            transform: scale(1.05);
            box-shadow: 0 0 15px #3498db;
        }

        .card.matched {
            border-color: #2ecc71;
            opacity: 0.6;
            cursor: default;
            transform: scale(0.95);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon {
            font-size: 60px;
            color: #3498db;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
        }

        .card.selected .icon {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 800px) {
            .card { width: 110px; height: 110px; }
            .board-row { gap: 15px; }
            h1 { font-size: 2rem; }
        }
        @media (max-width: 600px) {
            .card { width: 90px; height: 90px; }
            .board-row { gap: 10px; }
        }
    </style>
</head>
<body>

    <h1>🧠 Zuordnungsspiel</h1>
    <p class="instruction">Wähle ein Bild und den passenden Ton aus, um sie zu verbinden!</p>
    
    <div class="stats">
        <div>Versuche: <span id="moves">0</span></div>
        <div>Zeit: <span id="time">0</span>s</div>
    </div>
    
    <div class="board-container">
        <!-- Fila de imágenes -->
        <div class="board-row" id="image-board"></div>
        <!-- Fila de sonidos -->
        <div class="board-row" id="audio-board"></div>
    </div>

    <button class="btn" onclick="restartGame()">Spiel Neu Starten</button>

    <script>
        const imagesData = [
            { type: 'image', file: 'papel.jpeg', id: 'papel' },
            { type: 'image', file: 'grifo.jpeg', id: 'grifo' },
            { type: 'image', file: 'hojas.jpeg', id: 'hojas' },
            { type: 'image', file: 'lego.jpeg', id: 'lego' },
            { type: 'image', file: 'sila.jpeg', id: 'silla' }
        ];

        const audiosData = [
            { type: 'audio', file: 'freesound_community-rasgando-periodico-89415.mp3', id: 'papel' },
            { type: 'audio', file: 'freesound_community-agua-73988.mp3', id: 'grifo' },
            { type: 'audio', file: 'sspsurvival-footsteps-on-dry-leaves-and-grass-332958.mp3', id: 'hojas' },
            { type: 'audio', file: 'freesound_community-lego-bricks-2-67681.mp3', id: 'lego' },
            { type: 'audio', file: 'freesound_community-wooden-chair-move-86869.mp3', id: 'silla' }
        ];

        let imageBoard = document.getElementById('image-board');
        let audioBoard = document.getElementById('audio-board');
        
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let currentAudio = null;
        
        let matches = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function shuffle(array) {
            array.sort(() => Math.random() - 0.5);
        }

        function createCardElement(data) {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card');
            cardElement.dataset.id = data.id;
            cardElement.dataset.type = data.type;
            cardElement.dataset.file = data.file;

            if (data.type === 'image') {
                const imgElement = document.createElement('img');
                imgElement.src = data.file;
                cardElement.appendChild(imgElement);
            } else if (data.type === 'audio') {
                const iconElement = document.createElement('div');
                iconElement.classList.add('icon');
                iconElement.innerHTML = '🔊'; 
                cardElement.appendChild(iconElement);
            }

            cardElement.addEventListener('click', selectCard);
            return cardElement;
        }

        function initGame() {
            imageBoard.innerHTML = '';
            audioBoard.innerHTML = '';
            
            shuffle(imagesData);
            shuffle(audiosData);
            
            imagesData.forEach(data => imageBoard.appendChild(createCardElement(data)));
            audiosData.forEach(data => audioBoard.appendChild(createCardElement(data)));
        }

        function startTimer() {
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    timer++;
                    document.getElementById('time').innerText = timer;
                }, 1000);
            }
        }

        function playAudio(file) {
            if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
            currentAudio = new Audio(file);
            currentAudio.play();
        }

        function selectCard() {
            if (lockBoard) return;
            if (this.classList.contains('matched')) return;
            if (this === firstCard) return; 

            startTimer();

            // Si el usuario elige otra carta del mismo tipo antes de completar la pareja, cambiamos la selección
            if (firstCard && firstCard.dataset.type === this.dataset.type) {
                firstCard.classList.remove('selected');
                firstCard = this;
                this.classList.add('selected');
                if (this.dataset.type === 'audio') playAudio(this.dataset.file);
                return;
            }

            this.classList.add('selected');
            if (this.dataset.type === 'audio') playAudio(this.dataset.file);

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            document.getElementById('moves').innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;

            if (isMatch) {
                disableCards();
            } else {
                unselectCards();
            }
        }

        function disableCards() {
            firstCard.classList.remove('selected');
            secondCard.classList.remove('selected');
            
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            
            firstCard.removeEventListener('click', selectCard);
            secondCard.removeEventListener('click', selectCard);
            
            matches++;
            if (matches === imagesData.length) {
                winGame();
            }
            
            resetBoard();
        }

        function unselectCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('selected');
                secondCard.classList.remove('selected');
                if(currentAudio) { currentAudio.pause(); } 
                resetBoard();
            }, 1000); 
        }

        function resetBoard() {
            [firstCard, secondCard, lockBoard] = [null, null, false];
        }

        function winGame() {
            clearInterval(timerInterval);
            setTimeout(() => {
                confetti({
                    particleCount: 200,
                    spread: 90,
                    origin: { y: 0.6 }
                });
                alert(`Perfekt! Du hast alle Paare in ${moves} Versuchen und ${timer} Sekunden gefunden!`);
            }, 300);
        }

        function restartGame() {
            matches = 0;
            moves = 0;
            timer = 0;
            gameStarted = false;
            document.getElementById('moves').innerText = moves;
            document.getElementById('time').innerText = timer;
            clearInterval(timerInterval);
            if(currentAudio) { currentAudio.pause(); }
            
            initGame();
        }

        initGame();
    </script>
</body>
</html>

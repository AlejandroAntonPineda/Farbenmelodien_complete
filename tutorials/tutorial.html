<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video-Tutorials - Farbmelodien</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(120deg, #fdfbfb 0%, #ffecd2 100%);
            color: #333;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
            min-height: 100vh;
        }

        /* --- Header sin Logo --- */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        h1 {
            color: #ff8c00;
            font-size: 3rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #666;
            font-size: 1.3rem;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .video-card {
            background-color: white;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 6px solid #ff3344;
        }

        .video-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .thumbnail-container {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #f1f3f5, #e2e6ea);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .play-icon {
            font-size: 4rem;
            color: rgba(255, 51, 68, 0.8);
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s, color 0.3s;
        }

        .video-card:hover .play-icon {
            transform: scale(1.15);
            color: rgba(255, 51, 68, 1);
        }

        .video-title {
            font-size: 1.6rem;
            color: #2c3e50;
            margin: 15px 0 10px 0;
            font-weight: bold;
        }

        .video-desc {
            font-size: 1.05rem;
            color: #7f8c8d;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* --- Estilos del Modal --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: transparent;
            border-radius: 15px;
            width: 100%;
            max-width: 900px; 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content video {
            width: 100%;
            height: auto; 
            max-height: 85vh; 
            border-radius: 15px;
            outline: none;
            background-color: #000;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* --- Botón de cierre elegante --- */
        .btn-close {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 1001;
            padding: 0;
            line-height: 1;
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            transform: scale(1.1) rotate(90deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .btn-close {
                top: 20px;
                right: 20px;
                width: 40px;
                height: 40px;
                font-size: 1.4rem;
            }
            .modal-content video {
                border-radius: 8px;
            }
            .modal {
                padding: 10px; 
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Farbmelodien Video-Tutorials</h1>
        <p class="subtitle">Lerne die Grundlagen unseres musikalischen Systems</p>
    </div>

    <div class="gallery-container">
        
        <div class="video-card" onclick="oeffneVideo('Intro.mp4')">
            <div class="thumbnail-container">
                <span class="play-icon">▶️</span>
            </div>
            <h2 class="video-title">Einführung in Farbmelodien</h2>
            <p class="video-desc">Willkommen! In diesem Einführungsvideo erfährst du, wie du dein Kind im System begleiten kannst</p>
        </div>

    </div>

    <div id="videoModal" class="modal">
        <!-- Botón movido fuera del contenedor del video para mantenerlo fijo y elegante -->
        <button class="btn-close" onclick="schliesseVideo()" aria-label="Cerrar video">✕</button>
        <div class="modal-content">
            <video id="videoPlayer" controls controlsList="nodownload">
                Dein Browser unterstützt das Video-Tag leider nicht.
            </video>
        </div>
    </div>

    <script>
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');

        function oeffneVideo(videoPfad) {
            player.src = videoPfad; 
            modal.style.display = 'flex';
            
            player.play().catch(e => {
                console.log("Autoplay blockiert:", e);
            });

            if (player.requestFullscreen) {
                player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
                player.webkitRequestFullscreen();
            } else if (player.msRequestFullscreen) {
                player.msRequestFullscreen();
            }
        }

        function schliesseVideo() {
            modal.style.display = 'none';
            player.pause();
            player.removeAttribute('src'); 
            player.load();
            
            if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                schliesseVideo();
            }
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                schliesseVideo();
            }
        }
    </script>

</body>
</html>

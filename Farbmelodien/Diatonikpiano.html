<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piano Diatónico - Flecha Negra Centrada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #fdf6cc;
            display: flex;
            height: 100vh;
            width: 100vw;
            font-family: Arial, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
        }

        #piano-container {
            display: flex;
            width: 100%;
            height: 100%;
            touch-action: none; 
        }

        .key {
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;       /* Centra horizontalmente */
            justify-content: flex-end; /* Manda el contenido (la letra) hacia abajo */
            padding-bottom: 40px;      /* Espacio desde el borde inferior */
            font-size: 3rem; 
            font-weight: bold;
            color: #000;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
            cursor: pointer;
            border-right: 1px solid rgba(255,255,255,0.4);
            transition: filter 0.1s ease;
            position: relative;        /* Necesario para posicionar la flecha de forma independiente */
        }

        .key:last-child {
            border-right: none;
        }

        .key.active {
            filter: brightness(0.7);
        }

        /* Estilo específico para la flecha centrada en la tecla */
        .arrow {
            position: absolute;
            top: 50%;                  /* 50% desde arriba */
            left: 50%;                 /* 50% desde la izquierda */
            transform: translate(-50%, -50%); /* Ajuste fino para centrarla exactamente */
            font-size: 4rem;           /* Flecha un poco más grande para que destaque */
            color: #000;               /* Flecha negra sólida */
            pointer-events: none;      /* Evita que la flecha interfiera con los toques */
        }

    </style>
</head>
<body>
    
    <div id="piano-container">
        </div>

    <script>
        const notes = [
            { name: "C",  freq: 261.63, color: "#FF4545" },
            { name: "D",  freq: 293.66, color: "#FF8C00" },
            { name: "E",  freq: 329.63, color: "#FFD700" },
            { name: "F",  freq: 349.23, color: "#98FB98" },
            { name: "G",  freq: 392.00, color: "#00C853" },
            { name: "A",  freq: 440.00, color: "#2962FF" },
            { name: "H",  freq: 493.88, color: "#FF4081" },
            { name: "C",  freq: 523.25, color: "#FF4545", arrow: true } 
        ];

        const container = document.getElementById('piano-container');
        let audioCtx;
        const activeOscillators = {};

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNote(freq, keyId) {
            initAudio();
            if (activeOscillators[keyId]) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.value = freq;

            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(1, now + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.5, now + 1.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();

            activeOscillators[keyId] = { osc, gainNode };
        }

        function stopNote(keyId) {
            const activeNote = activeOscillators[keyId];
            if (activeNote) {
                const now = audioCtx.currentTime;
                const gainNode = activeNote.gainNode;
                const osc = activeNote.osc;

                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.4); 
                
                osc.stop(now + 0.5);
                delete activeOscillators[keyId];
            }
        }

        notes.forEach((note, index) => {
            const keyId = `key-${index}`;
            const keyDiv = document.createElement('div');
            
            keyDiv.className = 'key';
            keyDiv.id = keyId;
            keyDiv.style.backgroundColor = note.color;

            // Si la nota tiene la propiedad "arrow", dibujamos la flecha centrada y la letra abajo
            if (note.arrow) {
                // Creamos la flecha
                const arrowSpan = document.createElement('span');
                arrowSpan.className = 'arrow';
                arrowSpan.textContent = "↑";
                keyDiv.appendChild(arrowSpan);

                // Creamos la letra de la nota (que irá abajo gracias al flex-end)
                const noteSpan = document.createElement('span');
                noteSpan.textContent = note.name;
                keyDiv.appendChild(noteSpan);
            } else {
                // Si no lleva flecha, simplemente ponemos la letra de la nota
                keyDiv.textContent = note.name;
            }
            
            const startPress = (e) => {
                e.preventDefault(); 
                keyDiv.classList.add('active');
                playNote(note.freq, keyId);
            };

            const endPress = (e) => {
                e.preventDefault();
                keyDiv.classList.remove('active');
                stopNote(keyId);
            };

            keyDiv.addEventListener('mousedown', startPress);
            keyDiv.addEventListener('mouseup', endPress);
            keyDiv.addEventListener('mouseleave', endPress);

            keyDiv.addEventListener('touchstart', startPress, { passive: false });
            keyDiv.addEventListener('touchend', endPress, { passive: false });
            keyDiv.addEventListener('touchcancel', endPress, { passive: false });

            container.appendChild(keyDiv);
        });
    </script>
</body>
</html>
